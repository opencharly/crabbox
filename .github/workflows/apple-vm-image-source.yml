name: Verify Apple VM Image Source

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  pull_request:
    paths:
      - "internal/cli/os_image.go"
      - "internal/providers/applevm/backend.go"
      - "docs/features/configuration.md"
      - "docs/providers/apple-vm.md"
      - "scripts/apple-vm-image-source/**"
      - ".github/workflows/apple-vm-image-source.yml"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "internal/cli/os_image.go"
      - "internal/providers/applevm/backend.go"
      - "docs/features/configuration.md"
      - "docs/providers/apple-vm.md"
      - "scripts/apple-vm-image-source/**"
      - ".github/workflows/apple-vm-image-source.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Verify pinned Canonical source
    # Same-repository PRs only: this job checks out and runs the PR's own verifier on the
    # persistent fleet. Fork PRs must not execute their code there; the job is a visible skip.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'opencharly' }}
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          go-version-file: go.mod
          cache: false

      - name: Verify shipped image source
        run: go run ./scripts/apple-vm-image-source
