# Hermetic connector-lifecycle gate (tier 1 of
# https://github.com/openclaw/crabbox/issues/944).
#
# Every row runs with zero repository or provider credentials on hosted
# runners. Tier 2 (secret-backed cloud providers) is intentionally out of
# scope pending a maintainer credential policy; nothing in this file may
# reference repository or environment credentials.
#
# Rows considered but dropped:
#   - docker-sandbox live smoke (scripts/live-docker-sandbox-smoke.sh):
#     requires the proprietary Docker Sandboxes `sbx` CLI, which is not
#     preinstalled on hosted runners and needs `sbx login` account
#     authentication. The docker-sandbox connector is covered hermetically
#     by the trust-boundary row below, which drives the real CLI against a
#     fake `sbx` at the process boundary.
name: Connector E2E Smokes

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      desktop-resize-only:
        description: Run clean desktop provisioning and browser resizing proof only
        type: boolean
        default: false
      krun-guest-boot:
        description: Run the krun guest boot proof on a KVM-capable runner
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: connector-e2e-smokes-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOFLAGS: -mod=readonly -trimpath
  GOTOOLCHAIN: local

jobs:
  hermetic:
    if: ${{ !inputs.desktop-resize-only && !inputs.krun-guest-boot }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout-minutes || 15 }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: docker-sandbox-trust-boundary
            runner: ${{ vars.CI_DOCKER_RUNNER_LABEL || 'opencharly-ubuntu' }}
            build-cli: false
            smoke: scripts/docker-sandbox-trust-boundary-smoke.sh

          - name: local-container
            runner: ${{ vars.CI_DOCKER_RUNNER_LABEL || 'opencharly-ubuntu' }}
            build-cli: true
            # Cold bootstrap allows 20m; leave room for native E2E and cleanup.
            timeout-minutes: 40
            smoke: |
              set -o pipefail
              CRABBOX_LIVE=1 \
              CRABBOX_LIVE_PROVIDERS=local-container \
              CRABBOX_BIN="$PWD/bin/crabbox" \
                scripts/live-smoke.sh 2>&1 | tee "$RUNNER_TEMP/local-container-smoke.log"

          # The containerd SSH-lease core smoke: acquire -> SSH -> run ->
          # release on a stock image. Runs as root because nerdctl on a
          # non-root user selects the per-user rootless daemon, not the
          # rootful one this row installs. The prepared pod-crabbox* image
          # rows stay in scripts/live-containerd-smoke.sh for a prepared host;
          # CRABBOX_LIVE_CONTAINERD_IMAGES=0 keeps this row to the base path.
          - name: containerd
            runner: ${{ vars.CI_DOCKER_RUNNER_LABEL || 'opencharly-ubuntu' }}
            build-cli: true
            timeout-minutes: 30
            smoke: |
              set -o pipefail
              smoke_repo="$RUNNER_TEMP/crabbox-smoke-repo"
              mkdir -p "$smoke_repo"
              # The CI checkout is GitHub's synthetic `refs/pull/N/merge`
              # commit, which the containerd sync's remote git seed cannot
              # reproduce (the seed aborts at checkout, exit 128). Sync the
              # TREE without .git for this row: it still exercises the SSH
              # lease lifecycle end to end (acquire -> sync -> run -> release),
              # and the git seed itself is covered by the local-container row.
              git -C "$PWD" archive HEAD | tar -x -C "$smoke_repo"
              sudo env \
                CRABBOX_LIVE=1 \
                CRABBOX_LIVE_PROVIDERS=containerd \
                CRABBOX_LIVE_CONTAINERD_STRICT=1 \
                CRABBOX_LIVE_CONTAINERD_IMAGES=0 \
                CRABBOX_LIVE_REPO="$smoke_repo" \
                CRABBOX_BIN="$PWD/bin/crabbox" \
                "$PWD/scripts/live-smoke.sh" 2>&1 | tee "$RUNNER_TEMP/containerd-smoke.log"

          # Read-only doctor readiness contract. Hosted runners do not ship
          # Firecracker or CNI plugins, so the script's own
          # `classification=environment_blocked` outcome is an expected pass:
          # it proves the doctor JSON contract classifies missing
          # KVM/Firecracker/CNI prerequisites instead of failing opaquely.
          # `classification=validation_failed` (malformed doctor output)
          # still fails the row.
          - name: firecracker-readiness
            runner: ${{ vars.CI_RUNNER_LABEL || 'opencharly' }}
            build-cli: true
            smoke: |
              status=0
              output="$(scripts/live-firecracker-smoke.sh 2>&1)" || status=$?
              printf '%s\n' "$output"
              if [ "$status" -eq 0 ]; then
                exit 0
              fi
              if printf '%s\n' "$output" | grep -q 'classification=environment_blocked'; then
                echo "readiness contract held: missing prerequisites classified as environment_blocked"
                exit 0
              fi
              exit "$status"

          - name: ssh-localhost
            runner: ${{ vars.CI_RUNNER_LABEL || 'opencharly' }}
            build-cli: true
            smoke: CRABBOX_ARCH=amd64 CRABBOX_BIN="$PWD/bin/crabbox" scripts/live-ssh-localhost-smoke.sh

          # Mirrors the apple-vm job in ci.yml: hermetic native helper and
          # embedded VM daemon proof on Apple Silicon.
          - name: apple-vm
            runner: xcode-27
            build-cli: false
            smoke: |
              test "$(uname -m)" = arm64
              go vet ./internal/applevmhelper ./cmd/crabbox-apple-vm-helper
              go test -race ./internal/applevmhelper ./internal/providers/applevm
              sh scripts/build-vmd.sh
              go build -trimpath -tags vmdembed -o /tmp/crabbox-apple-vm-helper ./cmd/crabbox-apple-vm-helper
              /tmp/crabbox-apple-vm-helper vmd-info | grep -q '"embedded":true'

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          go-version-file: go.mod
          cache: false

      - name: Verify smoke dependencies are present in the runner image
        if: matrix.name == 'local-container'
        run: rg --version

      - name: Install containerd, nerdctl, and CNI plugins
        if: matrix.name == 'containerd'
        env:
          # nerdctl is not packaged in Ubuntu 24.04; pin the release and its
          # checksum. A containerd and runc already on the runner image are
          # used as-is: the Docker runner ships containerd.io, and installing
          # the Ubuntu `containerd` package would make docker-ce uninstallable
          # (docker-ce Depends: containerd.io).
          NERDCTL_VERSION: 2.4.1
          NERDCTL_SHA256: f6bbf02fd8a299cbcbc71a0bad113c1b63b3f33689bbb7d51b0fa98c6d361d5e
          CNI_VERSION: 1.9.1
          CNI_SHA256: b98f74a0f8522f0a83867178729c1aa70f2158f90c45a2ca8fa791db1c76b303
        run: |
          set -euo pipefail
          sudo apt-get update
          if ! command -v containerd >/dev/null 2>&1; then
            sudo apt-get install -y containerd
          fi
          if ! command -v runc >/dev/null 2>&1; then
            sudo apt-get install -y runc
          fi
          sudo systemctl enable --now containerd

          nerdctl_archive="$RUNNER_TEMP/nerdctl-$NERDCTL_VERSION-linux-amd64.tar.gz"
          curl --disable --fail --location --silent --show-error \
            --proto '=https' --proto-redir '=https' --connect-timeout 10 --max-time 60 \
            --output "$nerdctl_archive" \
            "https://github.com/containerd/nerdctl/releases/download/v$NERDCTL_VERSION/nerdctl-$NERDCTL_VERSION-linux-amd64.tar.gz"
          printf '%s  %s\n' "$NERDCTL_SHA256" "$nerdctl_archive" | sha256sum --check --strict
          sudo tar -xzf "$nerdctl_archive" -C /usr/local/bin nerdctl

          cni_archive="$RUNNER_TEMP/cni-plugins-linux-amd64-v$CNI_VERSION.tgz"
          curl --disable --fail --location --silent --show-error \
            --proto '=https' --proto-redir '=https' --connect-timeout 10 --max-time 60 \
            --output "$cni_archive" \
            "https://github.com/containernetworking/plugins/releases/download/v$CNI_VERSION/cni-plugins-linux-amd64-v$CNI_VERSION.tgz"
          printf '%s  %s\n' "$CNI_SHA256" "$cni_archive" | sha256sum --check --strict
          sudo mkdir -p /opt/cni/bin
          sudo tar -xzf "$cni_archive" -C /opt/cni/bin

          # Ephemeral CI host, persistent artefact: the workflow itself is the
          # durable fix, so providing/loading the module here is NOT the
          # rulebook's forbidden "works-until-reboot" workaround (that rule
          # targets a live host whose manual change evaporates on reboot).
          # Try the module, install the running kernel's extra-modules package
          # once if it is missing, then retry. The hard assertion in the next
          # step is unchanged: if the module genuinely cannot be provided, it
          # fails loudly naming opencharly/layer-containerd#5.
          if ! sudo modprobe xt_multiport 2>/dev/null; then
            sudo apt-get install -y "linux-modules-extra-$(uname -r)" >/dev/null 2>&1 || true
            sudo modprobe xt_multiport 2>/dev/null || true
          fi
          # Re-check the two surfaces the assertion reads, without suppressing it.
          sudo lsmod | grep '^xt_multiport ' || echo "xt_multiport still not loaded; the preflight will fail loudly"

          sudo nerdctl --version
          sudo nerdctl info --format '{{json .}}' >/dev/null
          # Docker's containerd ships the `moby` namespace; the provider's
          # uniform default is `default`. Create it so the base row can
          # acquire. The provider's own daemon verification stays the hard
          # check; this only makes the ephemeral host match the contract.
          sudo nerdctl namespace create default >/dev/null 2>&1 || true

          # The smoke runs as root (a non-root nerdctl selects the rootless
          # daemon, not the rootful one installed here). Let root's git trust
          # the runner-owned checkout instead of tripping safe.directory.
          sudo git config --global --add safe.directory "$PWD"

      - name: Require the CNI portmap kernel extension
        if: matrix.name == 'containerd'
        run: |
          # Two surfaces name the same capability. /proc/net/ip_tables_matches
          # only lists LEGACY ip_tables matches, so a runner using the nftables
          # iptables backend can have the module loaded (lsmod) while the proc
          # file stays silent. Accept either surface; fail only when NEITHER
          # shows the capability.
          if ! grep -qw multiport /proc/net/ip_tables_matches && ! lsmod | grep -q '^xt_multiport '; then
            echo "lsmod (netfilter matches): $(lsmod | grep -E '^(xt_multiport|ip_tables|nf_tables) ' || echo none)" >&2
            echo "::error::the kernel has no xt_multiport (neither the legacy ip_tables match list nor lsmod shows it); the CNI portmap plugin cannot publish the lease SSH port (opencharly/layer-containerd#5)"
            exit 1
          fi
          if grep -qw multiport /proc/net/ip_tables_matches; then
            echo "xt_multiport present in /proc/net/ip_tables_matches"
          else
            echo "xt_multiport loaded (lsmod); /proc/net/ip_tables_matches does not list it (nftables backend)"
          fi

      - name: Install security-current rsync
        if: matrix.name == 'ssh-localhost'
        env:
          RSYNC_VERSION: 3.4.4
          RSYNC_SHA256: bd88cf82fa653da32314fb229136407c5c90f80d1758d8f4b091767877d8fa96
        run: |
          archive="$RUNNER_TEMP/rsync-$RSYNC_VERSION.tar.gz"
          prefix="$RUNNER_TEMP/rsync-install"
          if ! curl --disable --fail --location --silent --show-error \
            --proto '=https' --proto-redir '=https' --connect-timeout 10 --max-time 60 \
            --output "$archive" \
            "https://download.samba.org/pub/rsync/src/rsync-$RSYNC_VERSION.tar.gz"; then
            curl --disable --fail --location --silent --show-error \
              --proto '=https' --proto-redir '=https' --connect-timeout 10 --max-time 60 \
              --output "$archive" \
              "https://github.com/RsyncProject/rsync/releases/download/v$RSYNC_VERSION/rsync-$RSYNC_VERSION.tar.gz"
          fi
          printf '%s  %s\n' "$RSYNC_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/rsync-$RSYNC_VERSION"
          ./configure \
            --prefix="$prefix" \
            --disable-openssl \
            --disable-xxhash \
            --disable-zstd \
            --disable-lz4 \
            --disable-iconv \
            --disable-acl-support \
            --disable-xattr-support
          make -j2
          make install
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Build CLI
        if: matrix.build-cli == true
        run: go build -trimpath -o bin/crabbox ./cmd/crabbox

      - name: Run connector lifecycle smoke
        run: ${{ matrix.smoke }}

      - name: Reject a skipped containerd smoke
        if: always() && matrix.name == 'containerd'
        run: |
          log="$RUNNER_TEMP/containerd-smoke.log"
          if [[ ! -f "$log" ]]; then
            echo "::error::the containerd smoke produced no log"
            exit 1
          fi
          if grep -q 'skip:' "$log"; then
            echo "::error::a skip is not a pass: $(grep -m1 'skip:' "$log")"
            exit 1
          fi

      - name: Verify native local-container lifecycle and cleanup
        if: matrix.name == 'local-container'
        env:
          CRABBOX_BIN: ${{ github.workspace }}/bin/crabbox
        run: |
          set -o pipefail
          go test -tags localcontainer -count=1 -run '^TestLocalContainerProviderE2E$' -timeout=15m -json ./cmd/crabbox | tee "$RUNNER_TEMP/local-container-e2e.jsonl"
          python3 - "$RUNNER_TEMP/local-container-e2e.jsonl" <<'PY'
          import json, sys
          records = [json.loads(line) for line in open(sys.argv[1])]
          for name in ('TestLocalContainerProviderE2E', 'TestLocalContainerProviderE2E/concurrent-cli-warmups'):
              for action in ('run', 'pass'):
                  assert any(r.get('Test') == name and r['Action'] == action for r in records), (name, action)
          assert not any(r['Action'] == 'skip' for r in records), 'native Docker fixture skipped'
          PY

      - name: Diagnose local-container bootstrap
        if: failure() && matrix.name == 'local-container'
        timeout-minutes: 1
        shell: bash
        run: |
          log="$RUNNER_TEMP/local-container-smoke.log"
          test -f "$log" || exit 0
          lease="$(sed -nE 's/^provisioning provider=local-container lease=(cbx_[0-9a-f]{12}) .*/\1/p' "$log")"
          if [[ ! "$lease" =~ ^cbx_[0-9a-f]{12}$ ]]; then
            echo "No unique smoke lease; skipping container diagnostics"
            exit 0
          fi
          containers="$(docker ps -aq --no-trunc --filter label=crabbox=true --filter label=provider=local-container --filter "label=lease=$lease")"
          if [[ ! "$containers" =~ ^[0-9a-f]{64}$ ]]; then
            echo "No unique exact smoke container; skipping container diagnostics"
            exit 0
          fi
          # Never dump Config.Env or argv: bootstrap needs only state and logs.
          docker inspect --format '{{json .State}}' "$containers"
          timeout 15s docker logs --tail 100 "$containers"

  desktop-resize:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.desktop-resize-only }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Bound provisioning and cleanup time
        run: echo "DESKTOP_PROOF_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          go-version-file: go.mod
          cache: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Build candidate and check desktop owners
        run: |
          go build -trimpath -o bin/crabbox ./cmd/crabbox
          go test ./internal/cli -run '^TestWebVNCURLs$' -count=1
          go test ./internal/providers/localcontainer -run '^Test(BootstrapScriptUsesAccountHomeDirectory|BootstrapScriptSupportsResizableXFCE)$' -count=1
      - name: Install locked browser proof dependencies
        run: |
          npm ci --prefix scripts
          ./scripts/node_modules/.bin/playwright install --with-deps chromium
      - name: Exercise clean desktops and real noVNC
        run: |
          ulimit -c 0
          node scripts/desktop-resize-proof.mjs
      - name: Upload bounded desktop proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-resize-proof-${{ github.sha }}
          path: dist/desktop-resize-proof
          if-no-files-found: error
          retention-days: 30

  # The krun guest boot, proved end to end on the KVM-capable Blacksmith fleet.
  #
  # Dispatch-only: it compiles libkrunfw's guest kernel (linux-6.12.109), libkrun
  # and crun from source, which is minutes of CPU and does not belong on every
  # PR. It runs on the Blacksmith label because that fleet exposes /dev/kvm —
  # measured in run 40026929314, `kvm=ok` — which the earlier
  # "impossible on the default fleet" conclusion denied.
  #
  # The shape is ABSENCE -> PERFORM -> PRESENCE, and the PRESENCE assertion is
  # run once BEFORE the runtime set is installed (R7: it must fail without the
  # install) and once after.
  krun-guest-boot:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.krun-guest-boot }}
    name: krun-guest-boot
    # NOT the generic `opencharly` label: that pool spans every tier, and the
    # 32-vCPU tier as deployed does not expose /dev/kvm. The 8-vCPU tier is the
    # one that measured `kvm=ok` (run 40026929314, `charly-ci-8vcpu-5-2`) after
    # distro-ubuntu#60 taught the tier to pass through a host CPU. The venue
    # step below still records /dev/kvm and skips visibly if a pod is not yet
    # rolled.
    runs-on: ${{ vars.CI_KRUN_RUNNER_LABEL || 'blacksmith-8vcpu-ubuntu-2404' }}
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reset any krun runtime set an earlier job left behind
        run: scripts/krun-guest-proof/reset-runtime-set.sh

      - name: ABSENCE — the /dev/kvm measurement and the missing runtime set
        id: venue
        run: |
          set -u -o pipefail

          echo "::group::/dev/kvm on this runner"
          if [ ! -e /dev/kvm ]; then
            echo "::warning title=krun-guest-boot skipped::/dev/kvm is absent on this runner. No krun runtime was installed and no guest was booted; a runner that exposes /dev/kvm would unblock this bed."
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::endgroup::"
            exit 0
          fi
          ls -l /dev/kvm
          grep -m1 -E 'vmx|svm' /proc/cpuinfo || echo "no vmx/svm flag in /proc/cpuinfo"
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::warning title=krun-guest-boot skipped::/dev/kvm exists but is not readable+writable by $(id -un). No krun runtime was installed and no guest was booted; a runner that grants /dev/kvm access would unblock this bed."
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::endgroup::"
            exit 0
          fi
          echo "kvm=present"
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

          echo "::group::Absent before the install"
          sudo systemctl enable --now containerd
          if command -v krun >/dev/null 2>&1; then
            echo "krun-binary=present path=$(command -v krun)"
          else
            echo "krun-binary=absent"
          fi
          if ldconfig -p | grep -q 'libkrun\.so\.1'; then
            echo "libkrun=present"
          else
            echo "libkrun=absent"
          fi
          if sudo containerd config dump 2>/dev/null | grep -q 'containerd\.runtimes\.krun'; then
            echo "krun-handler=declared"
          else
            echo "krun-handler=absent"
          fi
          echo "::endgroup::"

      - name: Prepare nerdctl and the pinned proof guest
        if: steps.venue.outputs.available == 'true'
        env:
          # Same pin, checksum and install path as the containerd row above.
          NERDCTL_VERSION: 2.4.1
          NERDCTL_SHA256: f6bbf02fd8a299cbcbc71a0bad113c1b63b3f33689bbb7d51b0fa98c6d361d5e
          # The guest base, pinned by digest: the tag `24.04` moves, the digest
          # does not.
          BASE_IMAGE: docker.io/library/ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac
        run: |
          set -euo pipefail
          sudo systemctl enable --now containerd
          # Unconditional: the pin is the input under test, so a nerdctl the
          # runner image happens to ship is replaced, never used unverified.
          archive="$RUNNER_TEMP/nerdctl-$NERDCTL_VERSION-linux-amd64.tar.gz"
          curl --disable --fail --location --silent --show-error \
            --proto '=https' --proto-redir '=https' --connect-timeout 10 --max-time 60 \
            --output "$archive" \
            "https://github.com/containerd/nerdctl/releases/download/v$NERDCTL_VERSION/nerdctl-$NERDCTL_VERSION-linux-amd64.tar.gz"
          printf '%s  %s\n' "$NERDCTL_SHA256" "$archive" | sha256sum --check --strict
          sudo tar -xzf "$archive" -C /usr/local/bin nerdctl
          nerdctl_version="$(nerdctl --version)"
          echo "nerdctl_version=$nerdctl_version"
          if ! printf '%s\n' "$nerdctl_version" | grep -q "version $NERDCTL_VERSION"; then
            echo "::error::nerdctl is not the pinned $NERDCTL_VERSION: $nerdctl_version"
            exit 1
          fi
          if ! command -v runc >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y runc
          fi
          nerdctl --version
          sudo nerdctl --namespace default namespace create default >/dev/null 2>&1 || true

          # The guest is an ordinary Ubuntu image plus the systemd-as-PID-1
          # pieces the krun boundary needs. It is assembled through containerd
          # itself (run a builder with the host network and the assets bind
          # mounted, then commit it), not through the runner's Docker daemon:
          # on this fleet the Docker overlayfs extractor fails on the image's
          # /boot entry (measured in run 40026929314, local-container row), and
          # Docker is not the engine under test here.
          sudo nerdctl --namespace default rm -f krun-proof-builder >/dev/null 2>&1 || true
          sudo nerdctl --namespace default pull "$BASE_IMAGE"
          sudo nerdctl --namespace default run --name krun-proof-builder \
            --net host \
            -v "$PWD/scripts/krun-guest-proof:/proof:ro" \
            -v /etc/resolv.conf:/etc/resolv.conf:ro \
            "$BASE_IMAGE" \
            sh -c 'apt-get update \
              && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends systemd systemd-sysv procps util-linux \
              && rm -rf /var/lib/apt/lists/* \
              && cp /proof/krun-proof.sh /usr/local/bin/krun-proof \
              && cp /proof/krun-proof.service /etc/systemd/system/krun-proof.service \
              && mkdir -p /usr/lib/systemd/system-shutdown /etc/systemd/system/multi-user.target.wants \
              && cp /proof/krun-poweroff.sh /usr/lib/systemd/system-shutdown/krun-poweroff \
              && chmod 0755 /usr/local/bin/krun-proof /usr/lib/systemd/system-shutdown/krun-poweroff \
              && ln -sf /dev/null /etc/systemd/system/serial-getty@hvc0.service \
              && ln -sf /etc/systemd/system/krun-proof.service /etc/systemd/system/multi-user.target.wants/krun-proof.service \
              && printf "%s\n" "kernel.pid_max=32768" > /etc/sysctl.d/50-pid-max.conf'
          # The committed CMD (not a --entrypoint override) is what libkrun's
          # init reads out of /.krun_config.json as the guest's PID 1.
          sudo nerdctl --namespace default commit \
            --change 'CMD ["/sbin/init"]' \
            krun-proof-builder "krun-proof:$GITHUB_SHA"
          sudo nerdctl --namespace default rm -f krun-proof-builder
          sudo nerdctl --namespace default image inspect "krun-proof:$GITHUB_SHA" >/dev/null
          echo "image=krun-proof:$GITHUB_SHA built from $BASE_IMAGE"

      - name: R7 — the presence assertion fails before the runtime set is installed
        if: steps.venue.outputs.available == 'true'
        run: |
          set -euo pipefail
          # Remove any previous name so the negative is about the runtime, not
          # the container name in the error text.
          sudo nerdctl --namespace default rm -f krun-absence >/dev/null 2>&1 || true
          rc=0
          output="$(sudo nerdctl --namespace default run --rm --name krun-absence \
            --runtime krun --net none \
            --ulimit nofile=524288:524288 \
            -e KRUN_INIT_PID1=1 \
            "krun-proof:$GITHUB_SHA" 2>&1)" || rc=$?
          printf '%s\n' "$output"
          echo "rc=$rc"
          if [ "$rc" -eq 0 ]; then
            echo "::error::nerdctl run --runtime krun succeeded before the runtime set was installed; the presence assertion cannot distinguish absence from presence"
            exit 1
          fi
          if ! printf '%s\n' "$output" | grep -qE 'invalid runtime name krun|failed to resolve runtime path'; then
            echo "::error::the pre-install failure does not name the unresolved krun runtime, so it is not the absence this step must prove: $output"
            exit 1
          fi
          echo "presence=failed-before-install (this is the R7 negative half)"
          sudo nerdctl --namespace default rm -f krun-absence >/dev/null 2>&1 || true

      - name: Install the krun build toolchain
        if: steps.venue.outputs.available == 'true'
        env:
          RUST_VERSION: "1.88.0"
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool pkg-config git curl ca-certificates \
            flex bison bc libelf-dev libssl-dev cpio kmod rsync xz-utils zstd \
            python3 python3-pyelftools patchelf \
            libsystemd-dev libprotobuf-c-dev libcap-dev libseccomp-dev \
            libjson-c-dev libmount-dev go-md2man \
            clang libclang-dev
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --no-modify-path
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup run "$RUST_VERSION" rustc --version

      - name: Build libkrunfw v5.6.2 (guest kernel 6.12.109)
        if: steps.venue.outputs.available == 'true'
        env:
          LIBKRUNFW_VERSION: v5.6.2
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$LIBKRUNFW_VERSION" \
            https://github.com/containers/libkrunfw "$RUNNER_TEMP/libkrunfw"
          cd "$RUNNER_TEMP/libkrunfw"
          # libkrunfw's Makefile treats a NON-EMPTY ARCH as the KERNEL's arch
          # spelling and derives GUESTARCH=$(ARCH). The OCI spelling `amd64`
          # would copy config-libkrunfw_amd64, which does not exist (the file
          # is config-libkrunfw_x86_64) — the build then dies at `cp`.
          export ARCH=x86_64
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig
          ldconfig -p | grep 'libkrunfw\.so\.5'

      - name: Build libkrun v1.19.6 (the 1.x API crun's handler resolves)
        if: steps.venue.outputs.available == 'true'
        env:
          LIBKRUN_VERSION: v1.19.6
          RUST_VERSION: "1.88.0"
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$LIBKRUN_VERSION" \
            https://github.com/containers/libkrun "$RUNNER_TEMP/libkrun"
          cd "$RUNNER_TEMP/libkrun"
          export PATH="$HOME/.cargo/bin:$PATH"
          # libkrun's kvm-bindings dependency runs bindgen, which dlopens
          # libclang. The libkrun README's Linux requirements list Rust, static
          # glibc and patchelf but omit this, and the build fails in
          # clang-sys when libclang is absent.
          LIBCLANG_PATH="$(dirname "$(find /usr/lib/llvm-* -name 'libclang.so' -print -quit)")"
          export LIBCLANG_PATH
          test -e "$LIBCLANG_PATH/libclang.so"
          echo "LIBCLANG_PATH=$LIBCLANG_PATH"
          RUSTUP_TOOLCHAIN="$RUST_VERSION" make -j"$(nproc)"
          sudo make install
          # libkrun's Makefile installs to $(PREFIX)/lib64 on Linux, and
          # Ubuntu's loader does not search /usr/local/lib64 by default.
          echo '/usr/local/lib64' | sudo tee /etc/ld.so.conf.d/krun.conf >/dev/null
          sudo ldconfig
          ldconfig -p | grep 'libkrun\.so\.1'
          test -f /usr/local/include/libkrun.h

      - name: Build crun at ca04fdb6 with libkrun support
        if: steps.venue.outputs.available == 'true'
        env:
          # The one commit carrying both the passt start path and the /proc
          # remount (src/libcrun/handlers/krun.c:824-838); no release has both.
          CRUN_COMMIT: ca04fdb6c26f0c8259871f2cccd0e6e652ec03ce
        run: |
          set -euo pipefail
          git clone https://github.com/containers/crun "$RUNNER_TEMP/crun"
          cd "$RUNNER_TEMP/crun"
          git checkout --detach "$CRUN_COMMIT"
          ./autogen.sh
          # A private prefix: the runner image may ship its own /usr/bin/crun,
          # and overwriting it would be a baseline alteration the reset could
          # not undo. The krun entry point below is the name containerd uses.
          ./configure --prefix=/usr/local --with-libkrun
          make -j"$(nproc)"
          sudo make install
          # crun selects the krun handler by the binary's name.
          sudo ln -sf /usr/local/bin/crun /usr/bin/krun
          crun --version
          crun --version | grep -q '+LIBKRUN'

      - name: Declare the krun handler in containerd
        if: steps.venue.outputs.available == 'true'
        env:
          CONTAINERD_VERSION: 2.4.2
        run: |
          set -euo pipefail
          version="$(containerd --version)"
          echo "containerd_version=$version"
          # Exact pin: the handler section and the config shape below are the
          # v2.4.2 document, and a different daemon must be a deliberate bump.
          case "$version" in
            *"v$CONTAINERD_VERSION "*) ;;
            *)
              echo "::error::containerd is not the pinned v$CONTAINERD_VERSION ($version); the krun handler section is [plugins.'io.containerd.cri.v1.runtime'.containerd.runtimes.krun]"
              exit 1
              ;;
          esac
          # `config dump` prints the RUNNING daemon's effective config, which on
          # this image has no config file and therefore no CRI runtimes table
          # (measured: "Configuration migrated from version 0"). The canonical
          # v4 document is what carries the table the handler belongs under.
          sudo containerd config default > "$RUNNER_TEMP/containerd.toml"
          python3 -I - "$RUNNER_TEMP/containerd.toml" <<'PY'
          import re
          import sys

          path = sys.argv[1]
          config = open(path).read()
          match = re.search(r"^\s*\[plugins\.(['\"])(.+?)\1\.containerd\.runtimes\]\s*$", config, re.M)
          if not match:
              sys.exit("no CRI runtimes table in the containerd config")
          plugin = match.group(2)
          if plugin != "io.containerd.cri.v1.runtime":
              sys.exit("CRI plugin id is %r, want io.containerd.cri.v1.runtime" % plugin)
          if re.search(r"^\s*\[plugins\.(['\"])%s\1\.containerd\.runtimes\.krun\]\s*$" % re.escape(plugin), config, re.M):
              sys.exit("a krun handler is already declared; refusing to duplicate it")
          config += (
              "\n[plugins.'%s'.containerd.runtimes.krun]\n"
              '  runtime_type = "io.containerd.runc.v2"\n'
              '  pod_annotations = ["krun.*"]\n'
              "  [plugins.'%s'.containerd.runtimes.krun.options]\n"
              '    BinaryName = "/usr/bin/krun"\n'
              "    SystemdCgroup = true\n" % (plugin, plugin)
          )
          open(path, "w").write(config)
          PY
          sudo install -m 0644 "$RUNNER_TEMP/containerd.toml" /etc/containerd/config.toml
          sudo systemctl restart containerd
          sudo containerd config dump | grep -A6 'containerd\.runtimes\.krun'

      - name: PRESENCE — boot the guest and assert from inside it
        if: steps.venue.outputs.available == 'true'
        run: |
          set -euo pipefail
          image="krun-proof:$GITHUB_SHA"
          name=krun-proof
          sudo nerdctl --namespace default rm -f "$name" >/dev/null 2>&1 || true
          sudo nerdctl --namespace default run -d --name "$name" \
            --runtime krun --net none \
            --ulimit nofile=524288:524288 \
            -e KRUN_INIT_PID1=1 \
            "$image"

          state="$(sudo nerdctl --namespace default inspect --format '{{.State.Status}}' "$name")"
          echo "container_state=$state"
          test "$state" = "running"

          # nerdctl wait is the synchronization primitive: it returns when the
          # guest has powered itself off. No polling loop, no sleep, and no
          # signal is sent from the host.
          wait_rc=0
          timeout 600 sudo nerdctl --namespace default wait "$name" || wait_rc=$?
          echo "nerdctl_wait_rc=$wait_rc"

          log="$RUNNER_TEMP/krun-guest.log"
          # The guest console reaches nerdctl on the container's STDERR (the
          # `[ERROR init_or_kernel]` lines are libkrun's own logger), so the
          # evidence file must capture both streams or it is empty.
          sudo nerdctl --namespace default logs "$name" 2>&1 | tee "$log"
          final="$(sudo nerdctl --namespace default inspect --format '{{.State.Status}}/{{.State.ExitCode}}' "$name")"
          echo "container_final=$final"

          # The guest console terminates lines with CRLF; strip the CR before
          # the anchored assertions so the line ending cannot hide a match.
          normalized="$RUNNER_TEMP/krun-guest.norm.log"
          tr -d '\r' < "$log" > "$normalized"
          # Anchored ERE: a trailing digit cannot satisfy any of these.
          check() {
            if ! grep -qE "$1" "$normalized"; then
              echo "::error::the guest log is missing: $1"
              exit 1
            fi
          }
          check 'KRUN_PROOF step=guest-boot$'
          check 'KRUN_PROOF pid1_comm=systemd$'
          check 'KRUN_PROOF pid1_cmdline=/sbin/init *$'
          check 'KRUN_PROOF kernel=6\.12\.109$'
          check 'nofile_hard=524288$'
          check 'KRUN_PROOF stop=systemctl-poweroff$'
          if [ "$final" != "exited/0" ]; then
            echo "::error::the container finished as $final, want exited/0"
            exit 1
          fi
          if [ "$wait_rc" -ne 0 ]; then
            echo "::error::nerdctl wait returned $wait_rc"
            exit 1
          fi

      - name: Diagnose the krun guest
        if: failure() && steps.venue.outputs.available == 'true'
        run: |
          sudo nerdctl --namespace default inspect krun-proof 2>&1 || true
          sudo nerdctl --namespace default logs krun-proof 2>&1 || true
          sudo journalctl -u containerd --no-pager -n 100 2>&1 || true
          sudo containerd config dump 2>&1 | grep -B2 -A6 'containerd\.runtimes\.krun' || true

      - name: Leave the runner at its baseline
        if: always()
        run: |
          if [ -x scripts/krun-guest-proof/reset-runtime-set.sh ]; then
            scripts/krun-guest-proof/reset-runtime-set.sh
          fi
